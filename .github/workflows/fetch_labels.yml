# Fetches the openFDA label sections for all 40 drugs in Code/configs/drugs.yaml
# and commits them to Data/raw/labels. No secret needed (openFDA allows 1,000
# requests a day without a key; this uses at most 120). Runs by itself when the
# drug list or the fetch script is pushed, or from the Actions tab.
name: Fetch drug labels

on:
  push:
    branches: [main]
    paths:
      - Code/configs/drugs.yaml
      - Code/data_gen/fetch_labels.py
      - .github/workflows/fetch_labels.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-labels
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}   # optional
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q requests pyyaml

      - name: Fetch labels for all drugs
        working-directory: Code
        run: |
          set -o pipefail
          mkdir -p ../Data/raw
          python -m data_gen.fetch_labels 2>&1 | tee ../Data/raw/fetch-labels.log

      - name: Upload labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labels-${{ github.run_number }}
          path: Data/raw
          if-no-files-found: warn

      - name: Commit labels back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/raw
          if git diff --cached --quiet; then echo "No label changes."; exit 0; fi
          git commit -m "openFDA labels for all drugs (run ${{ github.run_number }}) [skip ci]"
          git pull --rebase -q origin main
          git push
